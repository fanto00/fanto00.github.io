<style>
  :root{ --ink:#16161f; --bg:#e8e7e4; --paper:#fdfdfc; --mut:#8a877f; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;}
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;
    padding:10px 18px;background:rgba(232,231,228,.93);backdrop-filter:blur(8px);
    border-bottom:1px solid #cfcdc8;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:2px;}
  .topbar .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .sp{flex:1}
  .topbar select,.topbar a.btn{font:inherit;letter-spacing:1px;padding:5px 9px;border:1px solid var(--ink);
    background:transparent;color:var(--ink);border-radius:3px;cursor:pointer}
  .topbar a.btn{text-decoration:none;white-space:nowrap}
  .topbar a.btn:hover,.topbar select:hover{background:var(--ink);color:var(--paper)}
  main{padding:26px 14px 60px;display:flex;flex-direction:column;align-items:center;gap:26px}
  .pagewrap{margin:0;width:100%;max-width:var(--pw);scroll-margin-top:58px;}
  .pagewrap figcaption{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:3px;
    color:var(--mut);text-align:right;padding-top:7px}
  .page{width:794px;height:1119px;background:var(--paper);overflow:hidden;position:relative;
    transform-origin:top left;box-shadow:0 2px 10px rgba(0,0,0,.13);}
  .pagecontent{width:100%;height:100%}
  .zoomer{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;cursor:zoom-in}
  .pagewrap.zoomed .zoomer{cursor:zoom-out}
  .hint{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:2px;color:var(--mut);
    text-align:center;max-width:620px;line-height:1.7;padding:0 10px}
  @media print{ .topbar,.hint,.pagewrap figcaption{display:none} main{padding:0;gap:0}
    .page{box-shadow:none;transform:none!important} .pagewrap{max-width:none;break-after:page} }
</style>

<figure class="pagewrap" id="p6"><div class="page"><div class="pagecontent" style="display: flex; flex-direction: column; box-sizing: border-box;">
      <div style="background: #191927; color: #f4f4f2; padding: 44px 48px 36px 56px;">
        <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 3px; color: rgba(244,244,242,0.6);">
          <div>PROJECT 02</div>
          <div>POLIMI SAILING TEAM × DEWESOFT</div>
        </div>
        <div style="font-size: 32px; font-weight: 800; letter-spacing: 0.5px; margin-top: 14px; line-height: 1.15;">Hydrofoil Vibration Diagnostics</div>
        <div style="font-size: 12px; color: rgba(244,244,242,0.7); margin-top: 8px;">SuMoth prototype “ALTEA”, paper under review, <em>Journal of Sailing Technology</em></div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 34px 48px 48px 56px;">
        <div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 3px; color: #8a877f; margin-bottom: 8px; border-bottom: 1px solid #d8d6d1; padding-bottom: 6px;">THE PROBLEM</div>
          <p style="font-size: 12.5px; line-height: 1.7; margin: 0; text-wrap: pretty;">During progressive speed-profiling trials of the ALTEA prototype, anomalous vibratory behaviour was detected on the hydrofoil profiles, with unknown physical origin and excitation mechanisms. The goal: quantitatively characterize the phenomenon across the full operational speed range (up to 19 knots) to diagnose the root cause and inform design improvements for future foil generations.</p>
        </div>
        <div style="flex: 1;">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 3px; color: #8a877f; margin-bottom: 8px; border-bottom: 1px solid #d8d6d1; padding-bottom: 6px;">MY CONTRIBUTION</div>
          <ul style="font-size: 12.5px; line-height: 1.7; margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 9px;">
            <li><strong>Test protocol design:</strong> executed a dual-phase experimental diagnostic approach, correlating laboratory Experimental Modal Analysis (EMA) with operational on-water measurements.</li>
            <li><strong>Harsh-environment DAQ &amp; sensors:</strong> configured rugged DAQ systems (Dewesoft SIRIUS and IOLITE) and managed dynamic strain acquisitions via waterproof Wheatstone half-bridge strain gauges synchronized with a GPS unit.</li>
            <li><strong>Advanced signal processing:</strong> implemented a custom “Cubic Spline Detrending” procedure to isolate the high-frequency vibratory response from massive quasi-static hydrodynamic loads without phase distortion.</li>
            <li><strong>Data correlation &amp; higher-order analysis:</strong> processed raw data with STFT to generate velocity-frequency spectrograms, applying cross-velocity peak tracking and bicoherence analysis to confirm non-linear structural processes.</li>
          </ul>
        </div>

        <div style="font-size: 12px; color: rgba(244,244,242,0.7); margin-top: 8px;">Structural Health Monitoring of the Milan Metro railway network</div>
      </div>

        <div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 3px; color: #8a877f; margin-bottom: 8px; border-bottom: 1px solid #d8d6d1; padding-bottom: 6px;">THE PROBLEM</div>
          <p style="font-size: 12.5px; line-height: 1.7; margin: 0; text-wrap: pretty;">Milan metro lines require continuous monitoring of rail-surface defects (worn joints, head shelling, rolling-contact fatigue cracks) to plan maintenance before they escalate. The existing workflow relied on raw axlebox-accelerometer recordings (8 channels) with no automated way to turn multi-day acquisitions into a structured, trackable defect history. The goal: an end-to-end MATLAB system, a filtering pipeline that reliably detects and localizes defects despite speed variation and noise, and an inspection app to browse, prioritize and export this data.</p>
        </div>
        <div style="flex: 1;">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 3px; color: #8a877f; margin-bottom: 8px; border-bottom: 1px solid #d8d6d1; padding-bottom: 6px;">MY CONTRIBUTION</div>
          <ul style="font-size: 12.5px; line-height: 1.7; margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 9px;">
            <li><strong>Two-pass filtering &amp; detection pipeline:</strong> dual bandpass architecture (temporal 2–350 Hz + spatial 0.05–1.0 m wavelength) with CFAR-style adaptive RMS thresholding to isolate localized rail defects from quasi-static and rolling noise, at 2 mm spatial resolution.</li>
            <li><strong>Cross-run alignment:</strong> macro geometric alignment (cross-correlation on curvature) and sub-sample micro-alignment (Hilbert-envelope cross-correlation + FFT phase shift, ×5 upsampling), registering every run to a common reference with millimetric accuracy.</li>
            <li><strong>Two-pass database construction:</strong> clustering + history-completion engine (MASTER_DB) fusing detected triggers with “silent” passes below threshold, keeping degradation trends populated over time.</li>
            <li><strong>“Ultimate Inspector V10” GUI application:</strong> full MATLAB inspection app (package-based, global-variable-free architecture, 10 namespaces) with interactive filtering, per-defect signal inspection, automated PDF export, and a PCA + Autoencoder degradation-priority index (IPI).</li>
          </ul>

        <div style="font-size: 12px; color: rgba(244,244,242,0.7); margin-top: 8px;">Course project · Technologies for Artificial Intelligence</div>
      </div>

          <p style="font-size: 12.5px; line-height: 1.7; margin: 0; text-wrap: pretty;">Single-anchor Ultra-Wideband (UWB) indoor localization suffers from signal degradation: phase-difference Angle of Arrival (PDoA) calculations are highly sensitive to device orientation and ambient noise, making localization unstable. The goal was an embedded ML model (TinyML) correcting angle estimation in real time by fusing raw PDoA data with inertial (IMU) data directly on the edge device.</p>
        </div>
        <div style="flex: 1;">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 3px; color: #8a877f; margin-bottom: 8px; border-bottom: 1px solid #d8d6d1; padding-bottom: 6px;">MY CONTRIBUTION</div>
          <ul style="font-size: 12.5px; line-height: 1.7; margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 9px;">
            <li><strong>Data engineering:</strong> designed a multi-phase acquisition strategy (Radial, Random Walk, Inertial Stress Test) to capture signal dynamics; developed custom Python middleware to synchronize asynchronous UWB and ground-truth (RTLS) data streams.</li>
            <li><strong>Custom NN &amp; optimization:</strong> replaced black-box auto-generated code with a fully custom TensorFlow/Keras training pipeline preventing data leakage; ran Bayesian hyperparameter optimization on Weights &amp; Biases.</li>
            <li><strong>Embedded deployment (C++):</strong> deployed the inference engine on an Arduino Nano 33 BLE, writing custom firmware for live serial parsing, manual data standardization, and TFLite-Micro integration.</li>
            <li><strong>Resource pruning:</strong> implemented hybrid INT8 post-training quantization and library pruning to fit the model within the microcontroller’s memory limits.</li>
          </ul>
        </div>

        <div style="font-size: 12px; color: rgba(244,244,242,0.7); margin-top: 8px;">Forging force minimization &amp; deep-drawing energy reduction</div>
      </div>

          <p style="font-size: 12.5px; line-height: 1.7; margin: 0; text-wrap: pretty;">Optimize two distinct manufacturing operations: minimize peak force (F<sub>max</sub>) in a high-temperature forging process, and reduce total energy consumption of a 3-stage sheet-metal deep-drawing process (Bimby bowl). The core challenge: balancing mechanical and energetic efficiency with strict quality constraints, complete die closure in forging, no fractures or critical wrinkling in deep drawing.</p>
        </div>
        <div style="flex: 1;">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 3px; color: #8a877f; margin-bottom: 8px; border-bottom: 1px solid #d8d6d1; padding-bottom: 6px;">CORE TECHNICAL IMPLEMENTATIONS</div>
          <ul style="font-size: 12.5px; line-height: 1.7; margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 9px;">
            <li><strong>Forging FEM &amp; statistical metamodeling:</strong> executed an adaptive Design of Experiments strategy on a Forge Transvalor simulation; developed Least-Squares and Gaussian predictive metamodels in JMP correlating press speed and billet temperature to peak force.</li>
            <li><strong>Desirability optimization:</strong> used prediction profilers to pinpoint the optimal configuration (V = 180 mm/s, T = 1000 °C) minimizing F<sub>max</sub> with uncompromised component quality.</li>
            <li><strong>Iterative deep-drawing simulation:</strong> conducted a rigorous 3-stage simulation in Altair Inspire with advanced SS400 material models (Hill ’48 anisotropy, power hardening), evaluating Forming Limit Diagrams to predict and prevent failure.</li>
            <li><strong>Data integration &amp; energy calculation:</strong> engineered MATLAB scripts to numerically integrate force-displacement data from the FEM results, quantifying the impact of geometric die modifications (e.g. corner radii tuning).</li>
          </ul>
        </div>
        <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 2px; color: #8a877f; border-top: 1px solid #d8d6d1; padding-top: 18px;">

          <p style="font-size: 12.5px; line-height: 1.7; margin: 0; text-wrap: pretty;">Sailing has a high technical barrier to entry. The objective: an immersive VR sailing simulator for the Meta Quest 3, targeting students and beginners. The main challenge was balancing physical realism with the computational constraints of a standalone headset, while actively mitigating simulator-induced motion sickness, a notoriously high risk in maritime VR.</p>
        </div>
        <div style="flex: 1;">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 3px; color: #8a877f; margin-bottom: 8px; border-bottom: 1px solid #d8d6d1; padding-bottom: 6px;">CORE TECHNICAL IMPLEMENTATIONS</div>
          <ul style="font-size: 12.5px; line-height: 1.7; margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 9px;">
            <li><strong>Polar-diagram physics model:</strong> bypassed heavy fluid dynamics with a custom C# physics engine based on real-world yacht polar diagrams, mapping true wind angle directly to hull target speed.</li>
            <li><strong>Intuitive VR interactions:</strong> developed a physical “grab-and-rotate” virtual helm with 1:1 spatial mapping of wrist movements to the vessel’s yaw response.</li>
            <li><strong>Procedural sail automation:</strong> engineered intelligent scripts (AutoBoma, AutoFiocco) that dynamically trim mainsail and jib based on Apparent Wind Angle and tack detection.</li>
            <li><strong>Progressive UX &amp; sickness mitigation:</strong> structured learning from a static introductory room to open-world free roam and a timed regatta; excluded vertical oscillatory motion to reduce visual-vestibular conflicts.</li>
          </ul>
        </div>
        <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 2px; color: #8a877f; border-top: 1px solid #d8d6d1; padding-top: 18px;">

<script>
(function(){
  var W=794, H=1119, MAXUP=1.12;
  var wraps=[].slice.call(document.querySelectorAll('.pagewrap'));
  wraps.forEach(function(w){
    var page=w.querySelector('.page');
    var z=document.createElement('div'); z.className='zoomer';
    page.parentNode.insertBefore(z,page); z.appendChild(page);
    z.addEventListener('click',function(){ w.classList.toggle('zoomed'); layout(); });
  });
  function fitScale(){
    var avail=Math.min(document.documentElement.clientWidth-28, 880);
    return Math.max(.18, Math.min(MAXUP, avail/W));
  }
  function layout(){
    var fit=fitScale();
    var narrow=document.documentElement.clientWidth < 700;
    wraps.forEach(function(w){
      var s=w.classList.contains('zoomed') ? (narrow?1:Math.max(fit,1)) : fit;
      var page=w.querySelector('.page'), z=w.querySelector('.zoomer');
      page.style.transform='scale('+s+')';
      z.style.height=Math.round(H*s)+'px';
      z.style.overflowX = (W*s > z.clientWidth+1) ? 'auto' : 'hidden';
    });
    document.documentElement.style.setProperty('--pw', Math.round(W*fit)+'px');
  }
  var t; addEventListener('resize',function(){clearTimeout(t);t=setTimeout(layout,90);});
  layout(); addEventListener('load',layout);
  document.fonts && document.fonts.ready.then(layout);
  document.getElementById('jump').addEventListener('change',function(e){
    var el=document.getElementById(e.target.value); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    e.target.value='';
  });
})();
</script>
